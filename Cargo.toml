[package]
name = "osy-home"
description = "Smart home agent (Arduino Pro Micro + IR Receiver, 4 Relays, 4 Servo, 2 Motors)."
version = "0.1.0"
edition = "2024"

[dependencies]
osy-share.path = "../osy-kernel/crates/share"
osy-skill.path = "../osy-kernel/crates/skill"

atoman = { version = "0.12.2", features = ["full"] }
macron = { version = "0.5.2", features = ["full"] }
rigging = { version = "0.5.12", features = ["full"] }
pearce = { version = "0.7.0", features = ["full"] }
anylm = { version = "0.4.2", features = ["full"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = { version = "0.4.42", features = ["serde"] }
regex = "1.12.2"
rand = "0.10.1"
tokio-serial = "5.5.0"
